# ClaimLens is a single-page app: paths like /library or /ask?docs=… are routes in the
# browser, so any path that is not a file serves index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # pdf.js ships its worker as .mjs, which nginx's default types do not cover;
    # browsers refuse to run a module served as application/octet-stream.
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Build files have content hashes in their names, so they can be cached for good.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
